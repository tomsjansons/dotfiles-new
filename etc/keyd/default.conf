# keyd config — symlinked to /etc/keyd/default.conf
#   sudo ln -sf ~/.dotfiles/etc/keyd/default.conf /etc/keyd/default.conf
#   sudo keyd reload
# Emergency exit if the keyboard gets stuck: Backspace + Escape + Enter
# CapsLock<->Esc swap stays in niri xkb (caps:swapescape).

[ids]
# Das Keyboard 4 (no inline comments allowed in keyd!)
24f0:0140

[main]
# tap z = z, hold z = nav layer (150ms idle guard, 200ms hold)
z = lettermod(nav, z, 150, 200)

[nav]
h = left
j = down
k = up
l = right
