#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 600
max_height    = 900
image_filter  = "triangle"
image_quality = 75

[opener]
edit = [
  { run = 'nvim-new "$@"', desc = "nvim new", block = false, orphan = true, for = "unix" },
  { run = 'nvim "$@"', desc = "neovim", block = true, for = "unix" },
  { run = 'code "%*"', orphan = true, for = "windows" },
]
gpx = [
  { run = 'gpxsee "$@"', desc = "gpxsee", block = false, orphan = true, for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.gpx", use = "gpx" },
]
